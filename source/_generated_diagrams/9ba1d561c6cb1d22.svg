cing" textLength="71.9277" x="734.9507" y="20.7969">&#171;sistema&#187;</text></g><!--entity BdIvrLegacy--><g id="elem_BdIvrLegacy"><path d="M1223.5,159.8018 C1223.5,149.8018 1258.9092,149.8018 1258.9092,149.8018 C1258.9092,149.8018 1294.3184,149.8018 1294.3184,159.8018 L1294.3184,185.0986 C1294.3184,195.0986 1258.9092,195.0986 1258.9092,195.0986 C1258.9092,195.0986 1223.5,195.0986 1223.5,185.0986 L1223.5,159.8018 " fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;"/><path d="M1223.5,159.8018 C1223.5,169.8018 1258.9092,169.8018 1258.9092,169.8018 C1258.9092,169.8018 1294.3184,169.8018 1294.3184,159.8018 " fill="none" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="50.8184" x="1233.5" y="186.7969">BD_IVR</text></g><g id="elem_GMN14"><path d="M1126,26.8018 L1126,58.3018 L848.2,62.3018 L1126,66.3018 L1126,97.333 A0,0 0 0 0 1126,97.333 L1391.7529,97.333 A0,0 0 0 0 1391.7529,97.333 L1391.7529,36.8018 L1381.7529,26.8018 L1126,26.8018 A0,0 0 0 0 1126,26.8018 " fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M1381.7529,26.8018 L1381.7529,36.8018 L1391.7529,36.8018 L1381.7529,26.8018 " fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="186.3608" x="1132" y="43.8687">CNST-026 sin PII: el hash del</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="221.5522" x="1132" y="59.0015">telefono lo aplica el ETL upstream</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="228.2998" x="1132" y="74.1343">ANTES de poblar base_ivr_clientes.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="244.7529" x="1132" y="89.2671">El backend NUNCA ve el numero raw.</text></g><g id="elem_GMN17"><path d="M157,15.8018 L157,116.5986 A0,0 0 0 0 157,116.5986 L296,116.5986 L300,167.5618 L304,116.5986 L442.856,116.5986 A0,0 0 0 0 442.856,116.5986 L442.856,25.8018 L432.856,15.8018 L157,15.8018 A0,0 0 0 0 157,15.8018 " fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M432.856,15.8018 L432.856,25.8018 L442.856,25.8018 L432.856,15.8018 " fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="210.3296" x="163" y="32.8687">BReq-001 + BReq-003. Util para</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="264.856" x="163" y="48.0015">campanas inbound y dimensionamiento.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="229.4614" x="163" y="63.1343">CNST-007 read-only BD_IVR via SP.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="190.7534" x="163" y="78.2671">El SP entrega distinct counts,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="216.5186" x="163" y="93.3999">recurrence y new vs returning ya</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="190.6328" x="163" y="108.5327">pre-calculados sobre el hash.</text></g><!--link view_reports to UC_RPT_17--><g id="link_view_reports_UC_RPT_17"><path d="M96.16,205.3018 C128.42,205.3018 167.21,205.3018 206.5,205.3018 " fill="none" id="view_reports-to-UC_RPT_17" style="stroke:#181818;stroke-width:1.0;"/><polygon fill="#181818" points="212.5,205.3018,203.5,201.3018,207.5,205.3018,203.5,209.3018,212.5,205.3018" style="stroke:#181818;stroke-width:1.0;"/></g><!--link UC_RPT_17 to UC_INC_RPT_01--><g id="link_UC_RPT_17_UC_INC_RPT_01"><path d="M387.57,205.3018 C465.25,205.3018 573.54,205.3018 656.94,205.3018 " fill="none" id="UC_RPT_17-to-UC_INC_RPT_01" style="stroke:#181818;stroke-width:1.0;stroke-dasharray:7.