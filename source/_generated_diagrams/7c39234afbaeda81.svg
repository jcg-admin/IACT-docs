<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" height="678px" preserveAspectRatio="none" style="width:549px;height:678px;background:#FFFFFF;" version="1.1" viewBox="0 0 549 678" width="549px" zoomAndPan="magnify"><defs/><g><ellipse cx="237.5" cy="16" fill="#222222" rx="10" ry="10" style="stroke:#222222;stroke-width:1.0;"/><g id="ACTIVE"><rect fill="#F1F1F1" height="50" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="70.4561" x="202.5" y="113.5"/><line style="stroke:#181818;stroke-width:0.5;" x1="202.5" x2="272.9561" y1="139.7969" y2="139.7969"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="50.4561" x="212.5" y="131.4951">ACTIVE</text></g><g id="INACTIVE"><rect fill="#F1F1F1" height="50" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="85.0576" x="7" y="284"/><line style="stroke:#181818;stroke-width:0.5;" x1="7" x2="92.0576" y1="310.2969" y2="310.2969"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="65.0576" x="17" y="301.9951">INACTIVE</text></g><g id="BLOCKED"><rect fill="#F1F1F1" height="50" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="87.0059" x="196" y="429"/><line style="stroke:#181818;stroke-width:0.5;" x1="196" x2="283.0059" y1="455.2969" y2="455.2969"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="67.0059" x="206" y="446.9951">BLOCKED</text></g><ellipse cx="161.5" cy="621.5" fill="none" rx="11" ry="11" style="stroke:#222222;stroke-width:1.0;"/><ellipse cx="161.5" cy="621.5" fill="#222222" rx="6" ry="6" style="stroke:#222222;stroke-width:1.0;"/><g id="elem_GMN13"><path d="M307.5,103 L307.5,134.5 L272.56,138.5 L307.5,142.5 L307.5,173.5313 A0,0 0 0 0 307.5,173.5313 L541.3242,173.5313 A0,0 0 0 0 541.3242,173.5313 L541.3242,113 L531.3242,103 L307.5,103 A0,0 0 0 0 307.5,103 " fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M531.3242,103 L531.3242,113 L541.3242,113 L531.3242,103 " fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="191.623" x="313.5" y="120.0669">El usuario puede autenticar y</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="212.8242" x="313.5" y="135.1997">recibir tokens JWT. Sus permisos</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="173.8433" x="313.5" y="150.3325">efectivos se derivan de los</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="169.0635" x="313.5" y="165.4653">grupos asignados (RBAC).</text></g><g id="elem_GMN16"><path d="M127,266 L127,305 L92.32,309 L127,313 L127,351.6641 A0,0 0 0 0 127,351.6641 L360.3354,351.6641 A0,0 0 0 0 360.3354,351.6641 L360.3354,276 L350.3354,266 L127,266 A0,0 0 0 0 127,266 " fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M350.3354,266 L350.3354,276 L360.3354,276 L350.3354,266 " fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="212.3354" x="133" y="283.0669">No autentica. Tokens activos NO</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="208.2158" x="133" y="298.1997">se revocan automaticamente &#8212;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="156.7744" x="133" y="313.3325">expiran por TTL natural.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="165.2612" x="133" y="328.4653">Reversible sin perdida de</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="157.9932" x="133" y="343.5981">asignaciones de grupos.</text></g><g id="elem_GMN19"><path d="M207.5,571 L207.5,671.7969 L429.0034,671.7969 L429.0034,581 L419.0034,571 L207.5,571 " fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M419.0034,571 L419.0034,581 L429.0034,581 L419.0034,571 " fill="#FEFFDD" style="stroke:#181818;stroke-width:1.0;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="200.5034" x="213.5" y="588.0669">No autentica. Todos los tokens</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="197.8755" x="213.5" y="603.1997">activos del usuario se revocan</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="195.8633" x="213.5" y="618.3325">inmediatamente (jti blacklist).</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="191.1406" x="213.5" y="633.4653">Decision administrativa o por</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="159.98" x="213.5" y="648.5981">politica del sistema (e.g.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="126.5596" x="213.5" y="663.731">N intentos fallidos).</text></g><!--link *start* to ACTIVE--><g id="link_*start*_ACTIVE"><path d="M237.5,26.06 C237.5,44.34 237.5,80.19 237.5,107.09 " fill="none" id="*start*-to-ACTIVE" style="stroke:#181818;stroke-width:1.0;"/><polygon fill="#181818" points="237.5,113.09,241.5,104.09,237.5,108.09,233.5,104.09,237.5,113.09" style="stroke:#181818;stroke-width:1.0;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="132.3423" x="238.5" y="69.0669">Admin.create_user()</text></g><!--link ACTIVE to INACTIVE--><g id="link_ACTIVE_INACTIVE"><path d="M202.19,139.89 C157.49,142.51 82.01,154.53 46.5,204 C29.96,227.04 33.2548,255.1432 39.4948,277.9232 " fill="none" id="ACTIVE-to-INACTIVE" style="stroke:#181818;stroke-width:1.0;"/><polygon fill="#181818" points="41.08,283.71,42.5602,273.973,39.759,278.8876,34.8444,276.0865,41.08,283.71" style="stroke:#181818;stroke-width:1.0;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="124.7632" x="58.126" y="217.0669">Admin.deactivate()</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="146.0151" x="47.5" y="232.1997">(suspension temporal)</text></g><!--link INACTIVE to ACTIVE--><g id="link_INACTIVE_ACTIVE"><path d="M80.2,284 C89.3,277.59 99.51,271.05 109.5,266 C146.76,247.17 168.13,264.63 198.5,236 C218.88,216.79 227.6059,191.3232 232.3259,169.6032 " fill="none" id="INACTIVE-to-ACTIVE" style="stroke:#181818;stroke-width:1.0;"/><polygon fill="#181818" points="233.6,163.74,227.78,171.6853,232.5382,168.626,235.5976,173.3842,233.6,163.74" style="stroke:#181818;stroke-width:1.0;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="121.856" x="220.5" y="224.5669">Admin.reactivate()</text></g><!--link ACTIVE to BLOCKED--><g id="link_ACTIVE_BLOCKED"><path d="M272.36,163.51 C278.01,167.15 283.86,170.76 289.5,174 C315.7,189.05 329.64,182.15 350.5,204 C371.25,225.74 371.37,236.58 377.5,266 C385.29,303.42 394.79,317.91 377.5,352 C357.89,390.66 321.118,415.3696 288.538,431.7896 " fill="none" id="ACTIVE-to-BLOCKED" style="stroke:#181818;stroke-width:1.0;"/><polygon fill="#181818" points="283.18,434.49,293.0172,434.0114,287.645,432.2397,289.4167,426.8675,283.18,434.49" style="stroke:#181818;stroke-width:1.0;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="90.4287" x="419.5527" y="306.0669">Admin.block()</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="152.5342" x="388.5" y="321.1997">or SystemPolicy.block()</text></g><!--link INACTIVE to BLOCKED--><g id="link_INACTIVE_BLOCKED"><