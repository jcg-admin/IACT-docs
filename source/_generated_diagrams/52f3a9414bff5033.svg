<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" height="617px" preserveAspectRatio="none" style="width:388px;height:617px;background:#FFFFFF;" version="1.1" viewBox="0 0 388 617" width="388px" zoomAndPan="magnify"><defs/><g><!--entity ReporteRaw--><g id="elem_ReporteRaw"><rect fill="#F1F1F1" height="52.5938" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="157.5459" x="97" y="7"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="85.8867" x="107" y="29.9951">Reporte raw</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="137.5459" x="107" y="46.292">(template aplicado)</text></g><!--entity Sanitize--><g id="elem_Sanitize"><rect fill="#F1F1F1" height="52.5938" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="84.6406" x="133.5" y="137"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="55.5693" x="143.5" y="159.9951">Sanitize</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="64.6406" x="143.5" y="176.292">(PII filter)</text></g><!--entity HashSha256--><g id="elem_HashSha256"><rect fill="#F1F1F1" height="36.2969" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="120.4883" x="116" y="267"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="100.4883" x="126" y="289.9951">Hash SHA-256</text></g><!--entity HMACKMS--><g id="elem_HMACKMS"><rect fill="#F1F1F1" height="52.5938" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="220.9219" x="65.5" y="380"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="77.1572" x="75.5" y="402.9951">HMAC-KMS</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="200.9219" x="75.5" y="419.292">(firma con clave gestionada)</text></g><!--entity ReporteFirmado--><g id="elem_ReporteFirmado"><rect fill="#F1F1F1" height="52.5938" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="134.3447" x="7" y="534"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="114.3447" x="17" y="556.9951">Reporte firmado</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="95.8398" x="17" y="573.292">con signature</text></g><g id="elem_GMN11"><path d="M176,510 L176,610.7969 L381.7104,610.7969 L381.7104,520 L371.7104,510 L176,510 " fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M371.7104,510 L371.7104,520 L381.7104,520 L371.7104,510 " fill="#FEFFDD" style="stroke:#181818;stroke-width:1.0;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="184.7104" x="182" y="527.0669">La clave KMS esta protegida</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="146.2437" x="182" y="542.1997">por hardware (HSM en</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="161.5796" x="182" y="557.3325">produccion). Verificacion</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="180.083" x="182" y="572.4653">posterior reproduce el hash</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="127.6895" x="182" y="587.5981">y valida la firma sin</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="165.0898" x="182" y="602.731">exponer la clave privada.</text></g><!--link ReporteRaw to Sanitize--><g id="link_ReporteRaw_Sanitize"><path d="M176,60.1 C176,82.42 176,108.64 176,130.95 " fill="none" id="ReporteRaw-to-Sanitize" style="stroke:#181818;stroke-width:1.0;"/><polygon fill="#181818" points="17