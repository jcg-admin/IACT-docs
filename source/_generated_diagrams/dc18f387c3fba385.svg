g" textLength="193.1147" x="390.71" y="165.3325">FunctionGroupMembership) y</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="93.4946" x="390.71" y="180.4653">verificable por</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="155.3081" x="390.71" y="195.5981">UserCapabilityResolver.</text></g><g id="elem_GMN12"><path d="M189.71,296 L189.71,396.7969 L425.2989,396.7969 L425.2989,306 L415.2989,296 L189.71,296 " fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M415.2989,296 L415.2989,306 L425.2989,306 L415.2989,296 " fill="#FEFFDD" style="stroke:#181818;stroke-width:1.0;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="189.0142" x="195.71" y="313.0669">is_active=False (soft delete).</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="157.333" x="195.71" y="328.1997">La Function NO se borra</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="194.5938" x="195.71" y="343.3325">fisicamente. Las asignaciones</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="189.6045" x="195.71" y="358.4653">existentes se preservan pero</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="147.437" x="195.71" y="373.5981">la verificacion las filtra</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="214.5889" x="195.71" y="388.731">(AND f.is_active=True en query).</text></g><g id="elem_GMN15"><path d="M193.71,458 L193.71,573.9297 L421.7452,573.9297 L421.7452,468 L411.7452,458 L193.71,458 " fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M411.7452,458 L411.7452,468 L421.7452,468 L411.7452,458 " fill="#FEFFDD" style="stroke:#181818;stroke-width:1.0;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="167.4893" x="199.71" y="475.0669">El campo is_critical NO se</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="158.0439" x="199.71" y="490.1997">modifica desde este UC.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="154.375" x="199.71" y="505.3325">Cambios al flag solo via</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="207.0352" x="199.71" y="520.4653">data migration (ADR-BACK-010,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="127.8608" x="199.71" y="535.5981">capability separada</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="193.6353" x="199.71" y="550.731">manage_critical_function_flag</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="126.2549" x="199.71" y="565.8638">sin titular runtime).</text></g><!--link *start* to ACTIVE--><g id="link_*start*_ACTIVE"><path d="M111.71,26.38 C111.71,48.38 111.71,97.83 111.71,129.96 " fill="none" id="*start*-to-ACTIVE" style="stroke:#181818;stroke-width:1.0;"/><polygon fill="#181818" points="111.71,135.96,115.71,126.96,111.71,130.96,107.71,126.96,111.71,135.96" style="stroke:#181818;stroke-width:1.0;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="101.1563" x="118.0325" y="69.0669">create_function</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="111.8013" x="112.71" y="84.1997">(via UC_ADM_02)</text></g><!--link ACTIVE to ACTIVE--><g id="link_ACTIVE_ACTIVE"><path d="M147,145.08 C165.25,142.63 181.71,147.94 181.71,161 C181.71,174.06 171.1967,180.1683 152.9467,177.7183 " fill="none" id="ACTIVE-to-ACTIVE" style="stroke:#181818;stro