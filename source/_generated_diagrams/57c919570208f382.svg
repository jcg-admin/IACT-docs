.3711,203 L487.3711,193 L247.5,193 A0,0 0 0 0 247.5,193 " fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M487.3711,193 L487.3711,203 L497.3711,203 L487.3711,193 " fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="174.6685" x="253.5" y="210.0669">ADR-BACK-012: sin Celery.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="228.8711" x="253.5" y="225.1997">APScheduler.BackgroundScheduler</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="222.4473" x="253.5" y="240.3325">corre en el mismo proceso Python</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="118.2505" x="253.5" y="255.4653">que el app server.</text></g><g id="elem_GMN12"><path d="M533,178 L533,278.7969 A0,0 0 0 0 533,278.7969 L763.5552,278.7969 A0,0 0 0 0 763.5552,278.7969 L763.5552,188 L753.5552,178 L578.22,178 L436.42,86.11 L570.22,178 L533,178 A0,0 0 0 0 533,178 " fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M753.5552,178 L753.5552,188 L763.5552,188 L753.5552,178 " fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="191.9785" x="539" y="195.0669">IMPORTANTE: solo UN worker</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="209.5552" x="539" y="210.1997">ejecuta el scheduler. Los demas</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="167.5527" x="539" y="225.3325">workers solo sirven HTTP.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="131.1489" x="539" y="240.4653">Mecanismo: env var</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="208.292" x="539" y="255.5981">IACT_RUN_SCHEDULER=true en</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="162.9507" x="539" y="270.731">un solo Gunicorn worker.</text></g><!--link App to Sched--><g id="link_App_Sched"><path d="M320.79,86.11 C275.41,116.48 217.4567,155.2634 172.0967,185.6134 " fill="none" id="App-to-Sched" style="stroke:#181818;stroke-width:1.0;"/><polygon fill="#181818" points="167.11,188.95,176.8144,187.2696,171.2656,186.1695,172.3657,180.6207,167.11,188.95" style="stroke:#181818;stroke-width:1.0;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="96.3257" x="277.5" y="129.0669">on app ready()</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="40.4219" x="305.4519" y="144.1997">start()</text></g><!--link Sched to Job--><g id="link_Sched_Job"><path d="M109.5,268.31 C109.5,295.37 109.5,324.97 109.5,350 " fill="none" id="Sched-to-Job" style="stroke:#181818;stroke-width:1.0;"/><polygon fill="#181818" points="109.5,356,113.5,347,109.5,351,105.5,347,109.5,356" style="stroke:#181818;stroke-width:1.0;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="112.2075" x="110.5" y="322.0669">trigger every 60s</text></g><!--link Job to Svc--><g id="link_Job_Svc"><path d="M109.5,419.13 C109.5,442 109.5,467.11 109.5,489.96 " fill="none" id="Job-to-Svc" style="stroke:#181818;stroke-width:1.0;"/><polygon fill="#181818" points="109.5,495.96,113.5,486.96,109.5,490.96,105.5,486.96,109.5,495.96" style="stroke:#181818;stroke-width:1.0;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="88.4038" x="110.5" y="462.0669">evaluate_all()</text></g><!--SRC=[TL9DJy904BttLqmymG6Y7ZmG9IaVKHIHGBcPa6KxGg6TmTrj3V_UsIw26ZqrE_FclJTlghdOCo4vk1Xi5QqPr7uF5as5vfKQzoLbcWt11viT6hXgNe2o40lczdPlMAErtMwapop3IkMbScpcUeDfcTSqFQLtQyCbf