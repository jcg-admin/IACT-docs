style="stroke:#222222;stroke-width:1.0;"/><ellipse cx="409.5" cy="610.5" fill="#222222" rx="6" ry="6" style="stroke:#222222;stroke-width:1.0;"/><g id="elem_GMN14"><path d="M378,118 L378,157 L343.11,161 L378,165 L378,203.6641 A0,0 0 0 0 378,203.6641 L602.7534,203.6641 A0,0 0 0 0 602.7534,203.6641 L602.7534,128 L592.7534,118 L378,118 A0,0 0 0 0 378,118 " fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M592.7534,118 L592.7534,128 L602.7534,128 L592.7534,118 " fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="202.2173" x="384" y="135.0669">Estado transitorio en memoria.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="190.125" x="384" y="150.1997">Si el proceso muere antes de</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="186.2847" x="384" y="165.3325">persistir, se pierde el evento</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="203.7534" x="384" y="180.4653">(riesgo aceptado: el log normal</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="128.7939" x="384" y="195.5981">captura el request).</text></g><g id="elem_GMN17"><path d="M178.5,296 L178.5,319.5 L143.18,323.5 L178.5,327.5 L178.5,351.3984 A0,0 0 0 0 178.5,351.3984 L422.8867,351.3984 A0,0 0 0 0 422.8867,351.3984 L422.8867,306 L412.8867,296 L178.5,296 A0,0 0 0 0 178.5,296 " fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M412.8867,296 L412.8867,306 L422.8867,306 L412.8867,296 " fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="223.3867" x="184.5" y="313.0669">Append-only. Cada evento incluye</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="210.812" x="184.5" y="328.1997">``hash_prev`` encadenado para</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="170.1743" x="184.5" y="343.3325">verificacion de integridad.</text></g><g id="elem_GMN20"><path d="M204.5,443 L204.5,513.5313 A0,0 0 0 0 204.5,513.5313 L432.8716,513.5313 A0,0 0 0 0 432.8716,513.5313 L432.8716,453 L422.8716,443 L364.18,443 L473.34,348.74 L356.18,443 L204.5,443 A0,0 0 0 0 204.5,443 " fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M422.8716,443 L422.8716,453 L432.8716,453 L422.8716,443 " fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="183.2061" x="210.5" y="460.0669">Caso anormal &#8212; write fail al</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="207.3716" x="210.5" y="475.1997">storage de audit. Dispara alerta</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="172.1802" x="210.5" y="490.3325">inmediata (audit gap) y se</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="158.1899" x="210.5" y="505.4653">investiga manualmente.</text></g><g id="elem_GMN23"><path d="M6,575 L6,645.5313 A0,0 0 0 0 6,645.5313 L234.7651,645.5313 A0,0 0 0 0 234.7651,645.5313 L234.7651,585 L224.7651,575 L124.5,575 L120.5,503.65 L116.5,575 L6,575 A0,0 0 0 0 6,575 " fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M224.7651,575 L224.7651,585 L234.7651,585 L224.7651,575 " fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="207.7651" x="12" y="592.0669">Eliminacion fisica tras retencion</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="188.354" x="12" y="607.1997">(politica regulatoria). El hash</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="202.1792" x="12" y="622.3325">chain se preserva mediante un</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="113.5469" x="12" y="637.4653">marker de purga.</text></g><!--link *start* to RECEIVED--><g id="link_*start*_RECEIVED"><path d="M297.5,26.38 C297.5,48.38 297.5,97.83 297.5,129.96 " fill="none" id="*start*-to-RECEIVED" style="stroke:#181818;stroke-width:1.0;"/><polygon fill="#181818" points="297.5,135.96,301.5,126.96,297.5,130.96,293.5,126.96,297.5,135.96" style="stroke:#181818;stroke-width:1.0;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="149.3921" x="298.5" y="69.0669">middleware.intercept()</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="119.958" x="313.217" y="84.1997">(request entrante)</text></g><!--link RECEIVED to PERSISTED--><g id="link_RECEIVED_PERSISTED"><path d="M267.11,186.03 C228.84,216.29 168.1764,264.2485 129.8064,294.5885 " fill="none" id="RECEIVED-to-PERSISTED" style="stroke:#181818;stroke-width:1.0;"/><polygon fill="#181818" points="125.1,298.31,134.6406,295.8654,129.022,295.2088,129.6787,289.5901,125.1,298.31" style="stroke:#181818;stroke-width:1.0;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="153.48" x="232.677" y="247.0669">audit-validator.persist()</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="211.834" x="203.5" y="262.1997">(write succeeded, hash chained)</text></g><!--link RECEIVED to REJECTED--><g id="link_RECEIVED_REJECTED"><path d="M331.6,186.02 C340.81,192.15 350.9,198.55 360.5,204 C387.47,219.31 398.69,215.4 423.5,234 C447.89,252.28 466.8386,274.2413 481.5686,293.5313 " fill="none" id="RECEIVED-to-REJECTED" style="stroke:#181