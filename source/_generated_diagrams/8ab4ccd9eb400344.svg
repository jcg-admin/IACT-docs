th="178.9722" x="125.5" y="298.1997">BlacklistedToken hasta que</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="146.2373" x="125.5" y="313.3325">exp natural lo elimine.</text></g><g id="elem_GMN22"><path d="M485.5,266 L485.5,289.5 L450.23,293.5 L485.5,297.5 L485.5,321.3984 A0,0 0 0 0 485.5,321.3984 L695.146,321.3984 A0,0 0 0 0 695.146,321.3984 L695.146,276 L685.146,266 L485.5,266 A0,0 0 0 0 485.5,266 " fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M685.146,266 L685.146,276 L695.146,276 L685.146,266 " fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="188.646" x="491.5" y="283.0669">admin puede revocar TODAS</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="170.6313" x="491.5" y="298.1997">las sessions de un usuario</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="138.0488" x="491.5" y="313.3325">(e.g. al desactivarlo).</text></g><!--link *start* to active--><g id="link_*start*_active"><path d="M402.5,26.21 C402.5,45.81 402.5,86.23 402.5,114.89 " fill="none" id="*start*-to-active" style="stroke:#181818;stroke-width:1.0;"/><polygon fill="#181818" points="402.5,120.89,406.5,111.89,402.5,115.89,398.5,111.89,402.5,120.89" style="stroke:#181818;stroke-width:1.0;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="41.812" x="403.5" y="69.0669">login()</text></g><!--link active to active--><g id="link_active_active"><path d="M434.32,131.77 C452.33,128.99 469,133.73 469,146 C469,158.27 458.2598,163.9253 440.2498,161.1453 " fill="none" id="active-to-active" style="stroke:#181818;stroke-width:1.0;"/><polygon fill="#181818" points="434.32,160.23,442.6045,165.5561,439.2615,160.9928,443.8249,157.6498,434.32,160.23" style="stroke:#181818;stroke-width:1.0;"/><t