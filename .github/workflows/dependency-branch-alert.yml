name: Dependency Branch Sync Alert

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  dependency-branch-alert:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Detect dependency lock changes
        id: alert
        run: |
          chmod +x scripts/check-dependency-branch-alert.sh
          scripts/check-dependency-branch-alert.sh

      - name: Add summary
        if: steps.alert.outputs.alert_required == 'true'
        run: |
          {
            echo "## Dependency Branch Sync Alert"
            echo
            echo "${{ steps.alert.outputs.message }}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Comment on pull request
        if: steps.alert.outputs.alert_required == 'true'
        uses: actions/github-script@v9
        env:
          ALERT_MESSAGE_JSON: ${{ toJson(steps.alert.outputs.message) }}
        with:
          script: |
            const marker = '<!-- dependency-branch-sync-alert -->';
            const message = JSON.parse(process.env.ALERT_MESSAGE_JSON || '""');
            const body = `${marker}\n${message}`;
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;

            const { data: comments } = await github.rest.issues.listComments({
              owner,
              repo,
              issue_number,
              per_page: 100,
            });

            const existing = comments.find(c =>
              c.user?.type === 'Bot' && c.body?.includes(marker)
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body,
              });
            }
